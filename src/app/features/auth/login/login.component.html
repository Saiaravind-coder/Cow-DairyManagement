<div class="min-h-screen flex items-center justify-center px-4"
  style="background-color: #F5F5F0;">

  <div class="rounded-2xl shadow-lg w-full max-w-md p-8"
    style="background-color: white; border: 1px solid rgba(111,168,62,0.3);">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full mb-4"
        style="background-color: #F5F5F0;">
        <span class="text-3xl">🐄</span>
      </div>
      <h1 class="text-2xl font-bold" style="color: #6FA83E;">DairyFlow Pro</h1>
      <p class="text-sm mt-1" style="color: #888;">Sign in to your farm account</p>
    </div>

    <!-- Error -->
    <div *ngIf="error"
      class="text-sm rounded-lg px-4 py-3 mb-4"
      style="background-color: rgba(239,68,68,0.08);
             border: 1px solid rgba(239,68,68,0.3);
             color: #ef4444;">
      {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()">

      <!-- Farm Name -->
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1" style="color: #212121;">Farm Name</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2" style="color: #6FA83E;">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none"
              viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
          </span>
          <input [(ngModel)]="farmName" name="farmName" type="text"
            placeholder="Enter your farm name"
            class="w-full pl-10 rounded-lg px-4 py-2.5 text-sm focus:outline-none"
            style="border: 1px solid #6FA83E;
                   color: #212121;
                   background-color: #F5F5F0;"
            onfocus="this.style.boxShadow='0 0 0 3px rgba(111,168,62,0.2)'"
            onblur="this.style.boxShadow='none'"/>
        </div>
      </div>

      <!-- Password -->
      <div class="mb-6">
        <label class="block text-sm font-medium mb-1" style="color: #212121;">Password</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2" style="color: #6FA83E;">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none"
              viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </span>
          <input [(ngModel)]="password" name="password" type="password"
            placeholder="Enter your password"
            class="w-full pl-10 rounded-lg px-4 py-2.5 text-sm focus:outline-none"
            style="border: 1px solid #6FA83E;
                   color: #212121;
                   background-color: #F5F5F0;"
            onfocus="this.style.boxShadow='0 0 0 3px rgba(111,168,62,0.2)'"
            onblur="this.style.boxShadow='none'"/>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" [disabled]="loading"
        class="w-full text-white font-medium py-2.5 rounded-lg transition-all flex items-center justify-center gap-2"
        style="background-color: #6FA83E;"
        onmouseover="this.style.opacity='0.9'"
        onmouseout="this.style.opacity='1'">
        <svg *ngIf="loading" class="animate-spin w-4 h-4"
          xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10"
            stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>

    </form>

    <!-- Divider -->
    <div class="flex items-center gap-3 my-5">
      <div class="flex-1 h-px" style="background-color: #e5e5e5;"></div>
      <span class="text-xs" style="color: #aaa;">or</span>
      <div class="flex-1 h-px" style="background-color: #e5e5e5;"></div>
    </div>

    <!-- Register -->
    <p class="text-center text-sm" style="color: #212121;">
      Don't have an account?
      <a routerLink="/register" class="font-medium hover:underline" style="color: #6FA83E;">
        Register here
      </a>
    </p>

    <!-- Footer -->
    <div class="mt-6 py-3 text-center rounded-lg"
      style="background-color: #6FA83E;">
      <p class="text-xs text-white">🐄 DairyFlow Pro — Farm Management System</p>
    </div>

  </div>
</div>
